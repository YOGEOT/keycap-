<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRISTMAS CLICKER CUSTOM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eeeeee;
            color: #333333;
        }

        .page {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 썸네일 이미지 스타일 */
        .part-thumbnail-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
        }

        .option-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* PC/모바일 옵션 카드 인터랙션 */
        [data-part],
        [data-base],
        [data-model] {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* ====================================================
            3D 뷰어
        ==================================================== */
        .viewer {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        /* ====================================================
            패널
        ==================================================== */
        .panel {
            width: 380px;
            height: 100%;
            background: #ffffff;
            overflow-y: auto;
            padding: 24px;
            border-left: 1px solid #dddddd;
        }

        .panel h1 {
            margin: 0 0 24px;
            font-size: 22px;
        }

        .section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* ====================================================
            옵션 카드 스타일
        ==================================================== */
        .option-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .option {
            border: 1px solid #dddddd;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            background: #ffffff;
            transition: 0.15s;
        }

        .option:hover {
            border-color: #999999;
        }

        .option.active {
            border: 2px solid #333333;
            background: #fafafa;
        }

        .option-image {
            width: 100%;
            height: 80px;
            background: #f4f4f4;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #888888;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .option-name {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .option-price {
            font-size: 13px;
            color: #777777;
        }

        /* ====================================================
            슬롯 (키캡 위치)
        ==================================================== */
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, auto);
            gap: 8px;
        }

        .slot {
            padding: 12px 5px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            cursor: pointer;
        }

        .slot.active {
            border: 2px solid #333333;
            font-weight: bold;
        }

        .selected-slot-info {
            margin-top: 10px;
            padding: 10px 12px;
            background: #f7f7f7;
            border-radius: 8px;
            font-size: 13px;
            color: #666666;
        }

        /* ====================================================
            색상 선택
        ==================================================== */
        .color-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .color {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #dddddd;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color.active {
            outline: 2px solid #333333;
            outline-offset: 2px;
        }

        .color span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }

        /* ====================================================
            모바일 반응형
        ==================================================== */
        @media (max-width: 900px) {
            .page {
                flex-direction: column;
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                overflow: hidden;
            }

            .viewer {
                flex: 0 0 38dvh;
                width: 100%;
                height: 38dvh;
                min-height: 220px;
            }

            .panel {
                flex: 1;
                width: 100%;
                height: auto;
                overflow-y: auto;
                padding: 16px;
                border-top: 1px solid #dddddd;
                border-left: none;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- 3D 뷰어 -->
    <div class="viewer">
        <div id="canvas-container"></div>
    </div>

    <!-- 옵션 패널 -->
    <div class="panel">
        <h1>CHRISTMAS CUSTOM</h1>

        <!-- 케이스 섹션 -->
        <div class="section">
            <div class="section-title">케이스</div>
            <div class="option-grid">
                <div class="option active" data-base="case.glb" onclick="selectBase(this)">
                    <div class="option-image">베이직</div>
                    <div class="option-name">베이직</div>
                    <div class="option-price">15,900원</div>
                </div>

                <div class="option" data-base="case_3botton.glb" onclick="selectBase(this)">
                    <div class="option-image">3구</div>
                    <div class="option-name">3구 케이스</div>
                    <div class="option-price">11,900원</div>
                </div>
            </div>
        </div>

        <!-- 키캡 위치 섹션 -->
        <div class="section">
            <div class="section-title">키캡 위치</div>
            <div class="slot-grid">
                <div class="slot active" onclick="selectSlot(0, this)">KEY 1</div>
                <div class="slot" onclick="selectSlot(1, this)">KEY 2</div>
                <div class="slot" onclick="selectSlot(2, this)">KEY 3</div>
                <div class="slot" onclick="selectSlot(3, this)">KEY 4</div>
                <div class="slot" onclick="selectSlot(4, this)">KEY 5</div>
                <div class="slot" onclick="selectSlot(5, this)">KEY 6</div>
            </div>
            <div class="selected-slot-info">선택된 위치 : KEY 1</div>
        </div>

        <!-- 케이스 색상 섹션 -->
        <div class="section">
            <div class="section-title">케이스 색상</div>
            <div class="color-grid">
                <div class="color active" style="background:#000000" onclick="changeBaseColor('#000000', this)"></div>
                <div class="color" style="background:#ffffff" onclick="changeBaseColor('#ffffff', this)"></div>
                <div class="color" style="background:#c01d11" onclick="changeBaseColor('#c01d11', this)"></div>
                <div class="color" style="background:#7aa380" onclick="changeBaseColor('#7aa380', this)"></div>
            </div>
        </div>

        <!-- 파츠 섹션 (snow.glb 반영) -->
        <div class="section">
            <div class="section-title">파츠</div>
            <div class="option-grid">
                <div class="option" onclick="selectPart('none')">
                    <div class="option-image">NONE</div>
                    <div class="option-name">제거</div>
                    <div class="option-price">-</div>
                </div>

                <div class="option" onclick="selectPart('all-none')">
                    <div class="option-image">ALL</div>
                    <div class="option-name">전체 제거</div>
                    <div class="option-price">-</div>
                </div>

                <!-- snow.glb를 불러오도록 data-part="snow" 지정 -->
                <div class="option" data-part="snow" onclick="selectPart('snow')">
                    <div class="option-image">눈</div>
                    <div class="option-name">눈</div>
                    <div class="option-price">+1,000원</div>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
